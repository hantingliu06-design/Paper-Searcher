[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-compass"
version = "0.1.0"
description = "An inspectable literature research agent: plan, discover, rank, verify."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["research-agent", "literature-review", "google-scholar", "reproducibility"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
scholar-compass = "scholar_compass.__main__:main"

[tool.setuptools.packages.find]
include = ["scholar_compass*"]

[tool.setuptools.package-data]
scholar_compass = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
